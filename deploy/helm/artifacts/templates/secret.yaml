{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "artifacts.fullname" . }}
  labels:
    {{- include "artifacts.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.secrets.token }}
  ARTIFACTS_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.readToken }}
  ARTIFACTS_READ_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.shareToken }}
  ARTIFACTS_SHARE_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.signingSecret }}
  ARTIFACTS_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.s3AccessKeyId }}
  ARTIFACTS_S3_ACCESS_KEY_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.s3SecretAccessKey }}
  ARTIFACTS_S3_SECRET_ACCESS_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.oidcClientSecret }}
  ARTIFACTS_OIDC_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.webhookSecret }}
  ARTIFACTS_WEBHOOK_SECRET: {{ . | quote }}
  {{- end }}
{{- end }}
