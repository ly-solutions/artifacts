apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "artifacts.fullname" . }}-test"
  labels:
    {{- include "artifacts.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: healthz
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
      command: ["node", "-e", "fetch('http://{{ include "artifacts.fullname" . }}:{{ .Values.service.port }}/readyz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
