storage:
  driver: s3
  s3:
    bucket: artifacts
    endpoint: http://minio.storage.svc:9000
existingSecret: artifacts-secrets
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 16m
  hosts:
    - host: artifacts.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: artifacts-tls
      hosts: [artifacts.example.com]
embed:
  frameAncestors: https://workspace.example.com
