name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Runtime dependency licenses
        run: node scripts/check-licenses.mjs

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  s3:
    name: test against MinIO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=ci-user -e MINIO_ROOT_PASSWORD=ci-password-123 \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:9000/minio/health/live && break; sleep 1; done
      - name: Storage and service suites on a real S3 endpoint
        env:
          ARTIFACTS_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          ARTIFACTS_TEST_S3_BUCKET: ci
          ARTIFACTS_TEST_S3_ACCESS_KEY_ID: ci-user
          ARTIFACTS_TEST_S3_SECRET_ACCESS_KEY: ci-password-123
        run: node --test test/storage.test.mjs test/service.test.mjs

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Lint and render every value set
        run: |
          for values in deploy/helm/artifacts/ci/*.yaml; do
            echo "::group::$values"
            helm lint --strict deploy/helm/artifacts -f "$values"
            helm template ci deploy/helm/artifacts -f "$values" > /dev/null
            echo "::endgroup::"
          done
      - name: The fs driver refuses several replicas
        run: |
          if helm template ci deploy/helm/artifacts -f deploy/helm/artifacts/ci/fs-values.yaml --set replicaCount=2; then exit 1; fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compose up (server + MinIO) and wait for health
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Publish, version, read, share
        env:
          ARTIFACTS_URL: http://localhost:8080
          ARTIFACTS_TOKEN: local-demo-token-change-me
        run: |
          printf '# CI\n\nfirst\n' > /tmp/doc.md
          url=$(node bin/artifacts.mjs publish --file /tmp/doc.md --tags ci)
          slug=${url##*/a/}
          printf '# CI\n\nsecond\n' > /tmp/doc.md
          node bin/artifacts.mjs publish --slug "$slug" --file /tmp/doc.md --note second
          node bin/artifacts.mjs versions "$slug" | grep -q '^2 '
          node bin/artifacts.mjs get "$slug" --v 1 --format markdown | grep -q first
          share=$(node bin/artifacts.mjs share "$slug")
          curl -sf "http://localhost:8080${share#http://localhost:8080}/raw" | grep -q second
      - name: Logs
        if: failure()
        run: docker compose logs

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan the history for secrets
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose
